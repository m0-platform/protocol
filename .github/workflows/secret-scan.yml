###############################################################################
# Secret scan
#
# Calls the public org scanner at a pinned commit. That commit carries the EVM
# baseline (deployer_pk and bare 32-byte hex). gitleaks git scans the full
# history of this repo, not only the commits in the pull request.
###############################################################################

name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    permissions:
      contents: read
    uses: m0-platform/secret-scan/.github/workflows/secret-scan.yml@3272da02553e76c6f4b62f1ce64334053b8b73b6
