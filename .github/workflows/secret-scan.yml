###############################################################################
# Secret scan — public Gitleaks action
#
# https://github.com/gitleaks/gitleaks-action
# Org repos need a free GITLEAKS_LICENSE (gitleaks.io) as an Actions secret.
# Comments and SARIF upload are off so a finding is not published on a public PR.
# Org baseline adds the EVM 32-byte rules (deployer_pk, bare hex).
###############################################################################

name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch org Gitleaks baseline
        # EVM rules from m0-platform/secret-scan @ 640b598d5685d92449a7529bd29854823ee23481
        # gitleaks reads GITLEAKS_CONFIG. Comments stay off on public PRs.
        run: |
          curl -fsSL -o /tmp/m0-gitleaks.toml \
            https://raw.githubusercontent.com/m0-platform/secret-scan/640b598d5685d92449a7529bd29854823ee23481/.github/actions/secret-scan/gitleaks.toml

      - name: Run Gitleaks
        # gitleaks/gitleaks-action v3.0.0
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: /tmp/m0-gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
